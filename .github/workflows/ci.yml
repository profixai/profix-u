name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      # Pre-existing lint debt is not this workflow's problem to gate on.
      # Flip to `continue-on-error: false` once `bun run lint` is clean on main.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bunx vite preview --port 4173 --host 127.0.0.1 &
          echo $! > .preview.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 > /dev/null && break || sleep 1
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop preview server
        if: always()
        run: |
          if [ -f .preview.pid ]; then
            kill "$(cat .preview.pid)" || true
          fi
